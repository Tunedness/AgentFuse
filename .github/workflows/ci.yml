name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `@agentfuse/embeddings-local` depends on `onnxruntime-node`, and its
  # postinstall script reads a per-platform manifest: on `linux/x64` — which is
  # exactly what `ubuntu-latest` is — the default requirement is `cuda12`, and
  # those binaries are *not* bundled in the npm tarball. So every `npm ci` here
  # would fetch `Microsoft.ML.OnnxRuntime.Gpu.Linux` from nuget.org: 236 MB,
  # per job, on every run, and outside the npm cache `setup-node` restores.
  #
  # We never use it. `session.ts` pins `executionProviders: ['cpu']`, because
  # this is a background embedding queue on a developer's machine, not a
  # training rig. Skipping the download costs nothing and saves close to a
  # gigabyte per CI run across the matrix.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The FusePolicy schema is the public contract: people's editors validate
  # against the committed JSON Schema, while the runtime validates against the
  # zod object it is generated from. If those two ever disagree, a policy that
  # looks valid in an editor gets rejected at startup. This job makes that
  # impossible to ship.
  #
  # Pinned to Node 24 because the generator is a `.mts` file run through Node's
  # native type stripping.
  schema-drift:
    name: schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run schema:check

# The benchmarks live in `bench.yml`: they need a 23 MB model and minutes rather
# than seconds, and a red benchmark means something different from a red test.
