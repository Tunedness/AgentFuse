  # schema-drift:
  #   name: schema drift
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         cache: npm
  #     - run: npm ci
  #     - run: npm run build
  #     - run: npx agentfuse schema --emit
  #     - run: git diff --exit-code -- schemas/

